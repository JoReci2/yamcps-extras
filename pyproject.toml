[build-system]
requires = ["hatchling", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "yamcps-extras"
dynamic = ["version"]
description = "Development skills for yamcps, without MCP tools or prompts"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["yamcps>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff", "mypy", "build", "hatchling", "hatch-vcs>=0.4,<1", "editables", "coverage", "bandit", "radon"]

[project.entry-points."yamcps.connectors"]
extras = "yamcps_extras:ExtrasConnector"

[tool.hatch.version]
source = "vcs"
tag-pattern = "^v(?P<version>.+)$"

[tool.hatch.version.raw-options]
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]

[tool.hatch.build.targets.wheel]
packages = ["src/yamcps_extras"]

[project.urls]
Repository = "https://github.com/JoReci2/yamcps-extras"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/contributing.md", "/MIGRATION.md", "/LICENSE", "/pyproject.toml", "/.github/workflows"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
